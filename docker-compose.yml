version: '3.9'

services:

  db:
    image: postgres:16-alpine
    container_name: apartmani_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     apartmani_user
      POSTGRES_PASSWORD: apartmani_pass
      POSTGRES_DB:       apartmani_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apartmani_user -d apartmani_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
